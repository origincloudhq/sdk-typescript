# Keeps the SDK current with the API: daily, and when run by hand,
# scripts/update.sh moves it to the head of origincloudhq/api and generates
# it again. When that changes anything, the result is one pull request from
# the branch `regenerate`, refreshed by each later run until it is merged;
# when it changes nothing, an open one is closed.
#
# Commits someone adds to that pull request, such as a new service's
# package, are kept: a later run generates on top of them, with main merged
# in, and never closes a pull request that has them.
#
# The pull request is opened with the workflow token, which starts no
# pull_request run, so this dispatches CI on the branch; its result shows on
# the pull request's commit. Opening it needs "Allow GitHub Actions to create
# and approve pull requests" in the repository's Actions settings.
name: Regenerate

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: regenerate
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'
        with:
          ref: main
          fetch-depth: 0

      # The open pull request's branch, when someone has added commits to
      # it, with main merged in; main otherwise.
      - name: Base
        run: |
          set -euo pipefail
          echo "PREVIOUS=$(cat API_REVISION)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=main
          lease=""
          if git fetch --quiet origin "${BRANCH}" 2>/dev/null; then
            lease="$(git rev-parse FETCH_HEAD)"
            open="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
            added="$(git log --format=%ae origin/main..FETCH_HEAD | grep -cvxF "$(git config user.email)" || true)"
            if [[ -n "${open}" && "${added}" -gt 0 ]]; then
              git switch --quiet -C "${BRANCH}" FETCH_HEAD
              git merge --quiet --no-edit origin/main
              base=branch
            fi
          fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "LEASE=${lease}" >> "$GITHUB_ENV"

      - name: Node
        uses: 'actions/setup-node@v4'
        with:
          node-version: 20
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Update
        run: scripts/update.sh

      - name: Pull request
        run: |
          set -euo pipefail
          open="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ "${BASE}" == main && -z "$(git status --porcelain)" ]]; then
            echo "already current"
            if [[ -n "${open}" ]]; then
              gh pr close "${open}" --delete-branch --comment "main is current with the API."
            fi
            exit 0
          fi

          revision="$(cat API_REVISION)"
          git switch --quiet -C "${BRANCH}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git commit --quiet -m "Regenerate from origincloudhq/api@${revision:0:12}" \
              -m "API: https://github.com/origincloudhq/api/compare/${PREVIOUS}...${revision}"
          fi

          # Unchanged since the last run: nothing to push or check again.
          if [[ -n "${LEASE}" ]] && git diff --quiet "${LEASE}" HEAD; then
            echo "pull request #${open:-?} is current"
            exit 0
          fi
          # Replaces the branch only as this run found it: a commit pushed
          # meanwhile fails the run instead of being lost.
          git push --quiet --force-with-lease="${BRANCH}:${LEASE}" origin "${BRANCH}"

          body="Generated from [origincloudhq/api@${revision:0:12}](https://github.com/origincloudhq/api/commit/${revision}) ([changes](https://github.com/origincloudhq/api/compare/${PREVIOUS}...${revision})) by scripts/update.sh.

          If CI fails, the API has a new service that needs its package added under packages/ (the Update step's log names it, see CONTRIBUTING.md), or uses something the generator (generator/) doesn't support yet; add or extend it on this branch."
          if [[ -n "${open}" ]]; then
            gh pr edit "${open}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "Regenerate from the latest API" --body "${body}"
          fi
          gh workflow run ci.yml --ref "${BRANCH}"
